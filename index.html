<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fur & Fury</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#11151d;color:#fff;font-family:"Courier New",monospace;touch-action:none}
*{box-sizing:border-box}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none} .panel{position:absolute;background:#1b2030;border:4px solid #080a10;box-shadow:0 0 0 2px #59617a}
#hud{top:14px;left:14px;right:14px;height:76px;display:flex;align-items:flex-start;padding:10px 14px;gap:18px}
#portrait{width:54px;height:54px;border:3px solid #080a10;background:#28304a;display:grid;place-items:center;font-size:34px}.stats{flex:1}.row{height:26px;display:flex;align-items:center;gap:8px;font-weight:bold;font-size:14px}.bar{width:min(260px,25vw);height:14px;background:#080a10;padding:3px}.fill{height:100%;transition:width .12s}.hp{background:#ef476f}.xp{background:#55d6be}.wave{text-align:right;min-width:150px}
#weapon{right:14px;bottom:14px;width:210px;padding:10px 12px;font-size:13px;text-align:center}.tag{color:#ffd166}#bossbar{left:50%;top:98px;transform:translateX(-50%);width:min(520px,70vw);display:none;padding:8px;text-align:center}.bossfill{height:12px;background:#b13e53;margin-top:5px}.touch{display:none;position:absolute;pointer-events:auto;border:3px solid rgba(255,255,255,.18);background:rgba(27,32,48,.55);border-radius:50%;color:#fff}.touch:active{background:rgba(255,209,102,.65)}
#stick{left:20px;bottom:20px;width:150px;height:150px}#stickKnob{position:absolute;width:62px;height:62px;left:44px;top:44px;border-radius:50%;background:rgba(85,214,190,.45);border:3px solid #55d6be}#shoot{right:24px;bottom:28px;width:110px;height:110px;font-size:42px}#dash{right:148px;bottom:42px;width:74px;height:74px;font-size:24px}
@media(pointer:coarse),(max-width:900px){.touch{display:block}#weapon{display:none}#hud{height:66px;padding:7px 10px}#portrait{width:48px;height:48px;font-size:30px}.row{font-size:12px;height:23px}.bar{width:20vw}}
</style></head>
<body><canvas id="c"></canvas><div id="ui"><div id="hud" class="panel"><div id="portrait">🦊</div><div class="stats"><div class="row"><span>HP</span><div class="bar"><div id="hp" class="fill hp"></div></div></div><div class="row"><span>LV</span><div class="bar"><div id="xp" class="fill xp"></div></div><b id="level">1</b></div></div><div class="wave"><div>WAVE <b id="wave">1</b></div><div id="kills" class="tag">0 KILLS</div></div></div><div id="bossbar" class="panel">MOLTEN MASTIFF<div class="bossfill"><div id="bossfill" class="fill" style="background:#ffd166;width:100%"></div></div></div><div id="weapon" class="panel">RUSTY CARBINE<br><span class="tag" id="ammo">INFINITE</span></div><div id="stick" class="touch"><div id="stickKnob"></div></div><button id="shoot" class="touch">⌖</button><button id="dash" class="touch">»</button></div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()] = true;if(e.key===' '){mouse.down=true;e.preventDefault()} });addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')mouse.down=false});addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let state='title',score=0,wave=1,kills=0,shake=0,slow=0,particles=[],bullets=[],enemyBullets=[],enemies=[],pickups=[],texts=[];
const rand=(a,b)=>a+Math.random()*(b-a);function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
const player={x:W/2,y:H/2,r:16,hp:100,maxHp:100,level:1,xp:0,nextXp:100,speed:230,fire:0,fireRate:.16,damage:25,pierce:0,inv:0,dash:0,angle:0,trail:0};
function reset(){wave=1;kills=0;score=0;bullets=[];enemyBullets=[];enemies=[];pickups=[];particles=[];texts=[];Object.assign(player,{x:W/2,y:H/2,hp:100,maxHp:100,level:1,xp:0,nextXp:100,speed:230,fire:0,fireRate:.16,damage:25,pierce:0,inv:0,dash:0});spawnWave()}
function spawnEnemy(boss=false){let side=Math.floor(Math.random()*4),x,y;if(side===0){x=Math.random()*W;y=-30}else if(side===1){x=W+30;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+30}else{x=-30;y=Math.random()*H}let elite=wave>=3&&Math.random()<.12;enemies.push({x,y,r:boss?42:(elite?19:15),hp:boss?500+wave*100:(elite?75+wave*8:30+wave*9),maxHp:0,speed:(boss?58:(elite?82:72)+Math.random()*30),damage:boss?22:(elite?18:10),boss,elite,shoot:rand(.8,2),hit:0,phase:Math.random()*6.28})}
function spawnWave(){let n=6+wave*3;if(wave%5===0){spawnEnemy(true)}else for(let i=0;i<n;i++)spawnEnemy()}
function burst(x,y,c,n=8){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=rand(20,180);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.55),max:.55,c,size:rand(2,6)})}}
function shoot(){let a=player.angle,s=520;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:4,life:1.2,pierce:player.pierce,c:'#ffd166'})}
function enemyShoot(e){let a=Math.atan2(player.y-e.y,player.x-e.x);enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:7,life:5,c:e.boss?'#ef476f':'#55d6be'})}
function levelUp(){player.level++;player.xp-=player.nextXp;player.nextXp=Math.floor(player.nextXp*1.28);player.maxHp+=12;player.hp=Math.min(player.maxHp,player.hp+30);player.damage*=1.18;player.fireRate=Math.max(.07,player.fireRate*.91);slow=1.2;texts.push({x:W/2,y:H/2-100,text:'LEVEL UP!',life:1.8,c:'#55d6be',big:true})}
function update(dt){if(state!=='play')return;slow=Math.max(0,slow-dt);let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(touchMove.active){mx=touchMove.x;my=touchMove.y}if(keys.shift&&player.dash<=0)player.dash=.18;let l=Math.hypot(mx,my)||1;if(mx||my){player.x+=mx/l*player.speed*dt*(player.dash>0?2.1:1);player.y+=my/l*player.speed*dt*(player.dash>0?2.1:1)}player.x=Math.max(35,Math.min(W-35,player.x));player.y=Math.max(100,Math.min(H-35,player.y));player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);if(matchMedia('(pointer:coarse)').matches&&enemies.length){let target=enemies.reduce((best,e)=>dist(e,player)<dist(best,player)?e:best,enemies[0]);player.angle=Math.atan2(target.y-player.y,target.x-player.x)}player.fire-=dt;player.inv-=dt;player.dash-=dt;if((mouse.down||keys[' '])&&player.fire<=0){shoot();player.fire=player.fireRate}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){bullets.splice(i,1);continue}for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(dist(b,e)<b.r+e.r){e.hp-=player.damage;e.hit=.12;burst(b.x,b.y,'#ffd166',5);b.pierce--;if(b.pierce<0)bullets.splice(i,1);if(e.hp<=0){burst(e.x,e.y,e.boss?'#ef476f':'#55d6be',e.boss?35:12);kills++;score+=e.boss?1000:100;player.xp+=e.boss?100:30;if(Math.random()<.18&&!e.boss)pickups.push({x:e.x,y:e.y,type:Math.random()<.7?'hp':'rapid',r:10,life:12});enemies.splice(j,1)}break}}}
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.hit-=dt;e.phase+=dt*3;let a=Math.atan2(player.y-e.y,player.x-e.x);if(!e.boss||dist(e,player)>150)e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;e.shoot-=dt;if(e.shoot<=0&&dist(e,player)<500){enemyShoot(e);e.shoot=e.boss?.8:rand(1.4,3)}if(e.boss&&Math.random()<.012&&Math.hypot(player.x-e.x,player.y-e.y)<500)enemyShoot(e);if(dist(e,player)<e.r+player.r&&player.inv<=0){player.hp-=e.damage;player.inv=.8;shake=12;burst(player.x,player.y,'#ef476f',14);if(player.hp<=0){state='over';mouse.down=false}}}
 for(let i=enemyBullets.length-1;i>=0;i--){let b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){enemyBullets.splice(i,1);continue}if(dist(b,player)<b.r+player.r&&player.inv<=0){player.hp-=12;player.inv=.65;shake=8;burst(player.x,player.y,'#ef476f',8);enemyBullets.splice(i,1);if(player.hp<=0)state='over'}}
 for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];p.life-=dt;if(p.life<=0){pickups.splice(i,1);continue}if(dist(p,player)<24){if(p.type==='hp')player.hp=Math.min(player.maxHp,player.hp+30);else player.fireRate=Math.max(.055,player.fireRate*.82);pickups.splice(i,1)}}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=25*dt;if(texts[i].life<=0)texts.splice(i,1)}if(player.xp>=player.nextXp)levelUp();shake*=.86;document.getElementById('hp').style.width=(100*player.hp/player.maxHp)+'%';document.getElementById('xp').style.width=(100*player.xp/player.nextXp)+'%';document.getElementById('level').textContent=player.level;document.getElementById('kills').textContent=kills+' KILLS';
 let boss=enemies.find(e=>e.boss);document.getElementById('bossbar').style.display=boss?'block':'none';if(boss){boss.maxHp=boss.maxHp||boss.hp;document.getElementById('bossfill').style.width=Math.max(0,boss.hp/(boss.maxHp))*100+'%'}if(!enemies.length&&enemiesNeedSpawn===false){enemiesNeedSpawn=true;nextTimer=setTimeout(()=>{if(state!=='play')return;wave++;document.getElementById('wave').textContent=wave;spawnWave();enemiesNeedSpawn=false},1300)} }
let enemiesNeedSpawn=false,nextTimer;function polygon(x,y,r,sides,rot=0){ctx.beginPath();for(let i=0;i<sides;i++){let a=rot+i/sides*Math.PI*2;let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);rect(-17,-13,34,26,'#d98d62');rect(-10,-17,20,9,'#ffcc99');rect(-13,-22,26,7,'#d98d62');rect(-16,-21,6,8,'#d98d62');rect(10,-21,6,8,'#d98d62');rect(-9,-10,5,5,'#11151d');rect(4,-10,5,5,'#11151d');rect(-3,-4,6,3,'#11151d');ctx.rotate(-player.angle);rect(-24,-3,48,6,'#59617a');rect(8,-8,30,16,'#39435d');rect(34,-5,16,10,'#ffd166');ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);let c=e.hit>0?'#fff':e.boss?'#7d374d':e.elite?'#7b61a8':'#a8b14b';polygon(0,0,e.r,e.boss?8:6,e.phase*.12);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#080a10';ctx.lineWidth=5;ctx.stroke();if(e.elite||e.boss){ctx.fillStyle='#ffd166';ctx.fillRect(-e.r*.55,-e.r*.45,10,10);ctx.fillRect(e.r*.35,-e.r*.45,10,10)}ctx.fillStyle='#080a10';ctx.fillRect(-e.r*.35,-4,7,7);ctx.fillRect(e.r*.2,-4,7,7);ctx.restore();if(e.boss){rect(e.x-e.r*.7,e.y-e.r-18,e.r*1.4,5,'#080a10');rect(e.x-e.r*.7,e.y-e.r-18,e.r*1.4*(e.hp/e.maxHp),5,'#ef476f')}}
function draw(){ctx.save();ctx.clearRect(0,0,W,H);ctx.fillStyle='#252b3b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#30384b';ctx.lineWidth=2;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.translate(rand(-shake,shake),rand(-shake,shake));
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);rect(p.x,p.y,p.size,p.size,p.c)});ctx.globalAlpha=1;
 pickups.forEach(p=>{ctx.fillStyle=p.type==='hp'?'#ef476f':'#55d6be';polygon(p.x,p.y,p.r,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(p.x-2,p.y-5,4,10)});enemyBullets.forEach(b=>{ctx.fillStyle=b.c;polygon(b.x,b.y,b.r,8);ctx.fill()});bullets.forEach(b=>{ctx.fillStyle=b.c;ctx.fillRect(b.x-3,b.y-3,12,6)});enemies.forEach(drawEnemy);drawPlayer();texts.forEach(t=>{ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle=t.c;ctx.font=(t.big?'bold 38px':'bold 18px')+' Courier New';ctx.textAlign='center';ctx.fillText(t.text,t.x,t.y)});ctx.globalAlpha=1;ctx.restore();
 if(state==='title')overlay('FUR & FURY','WAVE ZERO','Move: WASD / arrows','Aim: mouse','Fire: hold click · Dash: SHIFT','Press ENTER or tap to deploy','#55d6be');if(state==='over')overlay('WASTED','SCORE '+score,'Wave reached '+wave,'Kills '+kills,'Press ENTER or tap to retry','#ef476f')}
function overlay(title,sub,a,b,c,d,col){ctx.fillStyle='rgba(8,10,16,.82)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=col;ctx.font='bold '+Math.min(72,W*.1)+'px Courier New';ctx.fillText(title,W/2,H*.32);ctx.fillStyle='#fff';ctx.font='bold 22px Courier New';ctx.fillText(sub,W/2,H*.32+42);ctx.fillStyle='#bfc7d9';ctx.font='18px Courier New';ctx.fillText(a,W/2,H*.32+82);ctx.fillText(b,W/2,H*.32+108);ctx.fillText(c,W/2,H*.32+134);ctx.fillStyle=col;ctx.font='bold 20px Courier New';ctx.fillText(d,W/2,H*.32+190)}
addEventListener('keydown',e=>{if(e.key==='Enter'&&(state==='title'||state==='over')){reset();state='play'}});canvas.addEventListener('touchstart',e=>{if(state==='title'||state==='over'){reset();state='play'}},{passive:true});
const touchMove={active:false,x:0,y:0};const stick=document.getElementById('stick'),knob=document.getElementById('stickKnob');stick.addEventListener('touchstart',e=>{touchMove.active=true;moveStick(e.touches[0])},{passive:false});stick.addEventListener('touchmove',e=>{moveStick(e.touches[0]);e.preventDefault()},{passive:false});stick.addEventListener('touchend',()=>{touchMove.active=false;touchMove.x=0;touchMove.y=0;knob.style.left='44px';knob.style.top='44px'});function moveStick(t){let r=stick.getBoundingRect();let cx=r.left+75,cy=r.top+75;let dx=t.clientX-cx,dy=t.clientY-cy,l=Math.hypot(dx,dy)||1;let m=Math.min(l,48);touchMove.x=dx/l*(m/48);touchMove.y=dy/l*(m/48);knob.style.left=(44+touchMove.x*35)+'px';knob.style.top=(44+touchMove.y*35)+'px'}
function aimTouch(e){if(e.touches&&e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY}}document.getElementById('shoot').addEventListener('touchstart',e=>{mouse.down=true;aimTouch(e);e.preventDefault()},{passive:false});document.getElementById('shoot').addEventListener('touchmove',aimTouch,{passive:true});document.getElementById('shoot').addEventListener('touchend',()=>mouse.down=false);document.getElementById('dash').addEventListener('touchstart',e=>{player.dash=.18;e.preventDefault()},{passive:false});
function loop(){let now=performance.now(),dt=Math.min(.033,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
